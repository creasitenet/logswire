parameters:
    # `%env(default::APP_PUBLIC_URL)%` resolves to null when unset, which a
    # `string` constructor argument rejects. A typed parameter keeps it ''.
    app_public_url_default: ''
    retention_default_days: 15
    retention_state_default: '%kernel.project_dir%/var/data/.retention_last_run'
    env(LOGSWIRE_TELEGRAM_BOT_TOKEN): ''
    env(LOGSWIRE_TELEGRAM_CHAT_ID): ''
    telegram_renotify_reopened: 0
    env(TRUSTED_PROXIES): ''
    ingest_default_max_body_bytes: 10485760
    ingest_default_max_items: 50
    ingest_default_max_item_bytes: 1048576
    ingest_scrub_default: 1
    uptime_http_timeout_ms: 5000
    uptime_retry_count: 2
    uptime_retry_delay_seconds: 1
    uptime_tick_seconds: 10
    uptime_probe_batch: 20
    uptime_hour_retention_days: 10
    uptime_retention_days: 90

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\EventSubscriber\ApiExceptionSubscriber:
        arguments:
            $debug: '%kernel.debug%'

    App\Service\Retention\RetentionService:
        arguments:
            $retentionDays: '%env(int:default:retention_default_days:LOGSWIRE_RETENTION_DAYS)%'

    App\Service\Retention\RetentionRunner:
        arguments:
            $stateFile: '%env(default:retention_state_default:RETENTION_STATE_FILE)%'

    App\Service\Project\ProjectService:
        arguments:
            $publicUrl: '%env(default:app_public_url_default:APP_PUBLIC_URL)%'

    App\Service\Telegram\TelegramChannel:
        arguments:
            $envBotToken: '%env(LOGSWIRE_TELEGRAM_BOT_TOKEN)%'
            $envChatId: '%env(LOGSWIRE_TELEGRAM_CHAT_ID)%'

    App\Service\Telegram\IssueAlerter:
        arguments:
            $renotifyReopened: '%env(bool:default:telegram_renotify_reopened:LOGSWIRE_TELEGRAM_RENOTIFY_REOPENED)%'

    App\Service\Ingest\IngestLimits:
        arguments:
            $maxBodyBytes: '%env(int:default:ingest_default_max_body_bytes:LOGSWIRE_INGEST_MAX_BODY_BYTES)%'
            $maxItems: '%env(int:default:ingest_default_max_items:LOGSWIRE_INGEST_MAX_ITEMS)%'
            $maxItemBytes: '%env(int:default:ingest_default_max_item_bytes:LOGSWIRE_INGEST_MAX_ITEM_BYTES)%'

    App\Service\Ingest\PayloadScrubber:
        arguments:
            $enabled: '%env(bool:default:ingest_scrub_default:LOGSWIRE_SCRUB_SENSITIVE)%'

    App\EventSubscriber\SecurityHeadersSubscriber:
        arguments:
            $publicUrl: '%env(default:app_public_url_default:APP_PUBLIC_URL)%'

    App\Command\DbBackupCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Probe\HttpProbe:
        arguments:
            $timeoutMs: '%env(int:default:uptime_http_timeout_ms:LOGSWIRE_UPTIME_HTTP_TIMEOUT_MS)%'
            $retryCount: '%env(int:default:uptime_retry_count:LOGSWIRE_UPTIME_RETRY_COUNT)%'
            $retryDelaySeconds: '%env(int:default:uptime_retry_delay_seconds:LOGSWIRE_UPTIME_RETRY_DELAY_SECONDS)%'

    App\Probe\ProbeScheduler:
        arguments:
            $batchSize: '%env(int:default:uptime_probe_batch:LOGSWIRE_UPTIME_PROBE_BATCH)%'

    App\Probe\UptimeRetentionPruner:
        arguments:
            $retentionDays: '%env(int:default:uptime_retention_days:LOGSWIRE_UPTIME_RETENTION_DAYS)%'
            $hourRetentionDays: '%env(int:default:uptime_hour_retention_days:LOGSWIRE_UPTIME_HOUR_RETENTION_DAYS)%'

    App\Command\ProbeLoopCommand:
        arguments:
            $tickSeconds: '%env(int:default:uptime_tick_seconds:LOGSWIRE_UPTIME_TICK_SECONDS)%'
            $heartbeatFile: '%kernel.project_dir%/var/probe.heartbeat'

    App\EventSubscriber\PublicUrlRequestContextSubscriber:
        arguments:
            $publicUrl: '%env(default:app_public_url_default:APP_PUBLIC_URL)%'
